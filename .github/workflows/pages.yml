name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，正在跑的不打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 需要先在 Settings → Pages 里把 Source 选成 "GitHub Actions"（只用点一次）。
      # 工作流自带的 token 没有权限替你打开这个开关，所以这一步没法自动化。
      - uses: actions/configure-pages@v5

      # 整个站点就是仓库根目录的几个静态文件，直接上传
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
