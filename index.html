<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4ead6">
<meta name="description" content="A 4x4 sudoku for kids. Four cells per box, numbers 1-4 only. No timer, no score.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>4x4 Sudoku</title>
<style>
  :root {
    --bg: #f4ead6;
    --cell: #faf4e6;
    --highlight: #ecdfc2;
    --selected: #a9d9f5;
    --same: #cfe9f8;
    --line: #b9a888;
    --border: #3f3a33;
    --ink: #5c4a3a;
    --ink-given: #3f3a33;
    --accent: #17549e;
    --error: #d6453d;
    --muted: #8b7b66;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .app {
    width: 100%;
    max-width: 460px;
    margin-block: auto;
    padding: 12px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
  }
  .topbar h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .5px;
    color: var(--border);
  }
  .txt-btn {
    border: none;
    background: none;
    padding: 8px 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    border-radius: 10px;
    min-width: 76px;
    text-align: left;
  }
  .txt-btn:active { background: rgba(23, 84, 158, .1); }
  .gear {
    border: none;
    background: none;
    padding: 8px;
    cursor: pointer;
    color: var(--accent);
    border-radius: 10px;
    min-width: 76px;
    display: flex;
    justify-content: flex-end;
  }
  .gear:active { background: rgba(23, 84, 158, .1); }
  .gear svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* ---------- board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    aspect-ratio: 1 / 1;
    background: var(--border);
    border: 3px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    touch-action: manipulation;
  }
  .cell {
    position: relative;
    background: var(--cell);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(34px, 13vw, 58px);
    font-weight: 400;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    transition: background .12s;
  }
  .cell[data-c="1"] { border-right: 3px solid var(--border); }
  .cell[data-r="1"] { border-bottom: 3px solid var(--border); }

  .cell.given { color: var(--ink-given); font-weight: 500; }
  .cell.filled { color: var(--accent); }
  .cell.peer { background: var(--highlight); }
  .cell.same { background: var(--same); }
  .cell.selected { background: var(--selected); }
  .cell.wrong { color: var(--error); }
  .cell.flash { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .cell.pop { animation: pop .25s ease-out; }
  @keyframes pop {
    0% { transform: scale(.55); }
    70% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .notes {
    position: absolute;
    inset: 6%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    pointer-events: none;
  }
  .notes span {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(13px, 4.6vw, 20px);
    color: var(--muted);
    font-weight: 600;
  }

  /* ---------- tools ---------- */
  .tools {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  .tool {
    position: relative;
    border: none;
    background: none;
    padding: 8px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    border-radius: 12px;
  }
  .tool:active { background: rgba(23, 84, 158, .08); }
  .tool:disabled { color: #b6ab97; cursor: default; }
  .tool svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .badge {
    position: absolute;
    top: 2px;
    left: 50%;
    margin-left: 6px;
    background: var(--muted);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    letter-spacing: .5px;
  }
  .tool[data-on="true"] .badge { background: var(--accent); }

  /* ---------- number pad ---------- */
  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .pad button {
    border: none;
    background: rgba(255, 255, 255, .55);
    border-radius: 14px;
    padding: 14px 0;
    font-size: clamp(32px, 10vw, 44px);
    font-weight: 400;
    color: var(--accent);
    cursor: pointer;
    transition: transform .08s, background .12s;
  }
  .pad button:active { transform: scale(.94); background: rgba(23, 84, 158, .15); }
  .pad button.done { color: #bfb09a; background: rgba(255, 255, 255, .3); }

  /* ---------- dialogs ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(63, 58, 51, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;      /* keeps hidden dialogs out of tab order / screen readers */
    pointer-events: none;
    /* fade out first, then hide; when showing, become visible immediately */
    transition: opacity .25s, visibility 0s linear .25s;
    z-index: 10;
  }
  .overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .25s, visibility 0s;
  }
  .card {
    background: var(--bg);
    border-radius: 22px;
    padding: 28px 24px 20px;
    text-align: center;
    max-width: 320px;
    width: 100%;
    transform: scale(.85);
    transition: transform .25s;
  }
  .overlay.show .card { transform: scale(1); }
  .card .emoji { font-size: 56px; line-height: 1; }
  .card h2 { margin: 14px 0 6px; font-size: 24px; color: var(--border); }
  .card p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
  .btn {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    padding: 14px;
    border-radius: 14px;
    cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn.ghost {
    background: rgba(23, 84, 158, .1);
    color: var(--accent);
    margin-top: 10px;
  }
  .btn.danger { background: none; color: var(--error); font-weight: 500; font-size: 15px; margin-top: 6px; }

  /* settings sheet */
  .card.settings { text-align: left; }
  .card.settings h2 { text-align: center; margin-top: 0; }
  .field { margin: 18px 0 4px; }
  .field > label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .segmented {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, .5);
    padding: 4px;
    border-radius: 12px;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: none;
    padding: 10px 2px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .hint-text { font-size: 13px; color: var(--muted); margin: 10px 0 0; text-align: center; }

  /* ---------- stamp collection ---------- */
  .collection {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .slots {
    flex: 1;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0;
    scrollbar-width: none;
  }
  .slots::-webkit-scrollbar { display: none; }
  .slot {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: rgba(255, 255, 255, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }
  .slot.empty {
    background: none;
    border: 2px dashed rgba(139, 123, 102, .4);
  }
  .slot.earned { cursor: pointer; }
  .slot.earned:active { transform: scale(.92); }
  .slot svg { width: 32px; height: 32px; display: block; }
  .slot.divider {
    width: 1px;
    height: 22px;
    background: rgba(139, 123, 102, .3);
    border-radius: 0;
    align-self: center;
  }
  .next-reward {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    line-height: 1.25;
    max-width: 88px;
  }

  /* ---------- reward / evolution ---------- */
  .stage {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 6px;
  }
  .stage svg.creature {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .rays {
    position: absolute;
    inset: -30%;
    background: repeating-conic-gradient(from 0deg,
      rgba(255, 236, 180, .95) 0deg 7deg, rgba(255, 236, 180, 0) 7deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 70%);
    mask-image: radial-gradient(circle, #000 30%, transparent 70%);
    opacity: 0;
    pointer-events: none;
  }
  .rays.burst { animation: rays 1.1s ease-out; }
  @keyframes rays {
    0%   { opacity: 0; transform: scale(.3) rotate(0deg); }
    35%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.25) rotate(90deg); }
  }

  .creature.hidden { opacity: 0; }
  .creature.appear { animation: appear .7s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes appear {
    0%   { opacity: 0; transform: scale(.3) translateY(14px); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* evolution: wobble, flash to white silhouettes trading places, then reveal */
  .creature.evo-old { animation: evoOld 3s ease-in-out forwards; }
  .creature.evo-new { opacity: 0; animation: evoNew 3s ease-in-out forwards; }
  @keyframes evoOld {
    0%, 18%   { opacity: 1; filter: none; transform: scale(1) rotate(0deg); }
    6%        { transform: scale(1) rotate(-5deg); }
    12%       { transform: scale(1) rotate(5deg); }
    22%       { opacity: 1; filter: brightness(0) invert(1); transform: scale(.9); }
    30%, 46%, 62% { opacity: 0; filter: brightness(0) invert(1); }
    38%, 54%  { opacity: 1; filter: brightness(0) invert(1); transform: scale(.92); }
    70%, 100% { opacity: 0; }
  }
  @keyframes evoNew {
    0%, 26%   { opacity: 0; filter: brightness(0) invert(1); transform: scale(1.02); }
    34%, 50%  { opacity: 1; filter: brightness(0) invert(1); transform: scale(1.06); }
    42%, 58%  { opacity: 0; filter: brightness(0) invert(1); }
    66%       { opacity: 1; filter: brightness(0) invert(1); transform: scale(1.1); }
    78%       { opacity: 1; filter: none; transform: scale(1.14); }
    100%      { opacity: 1; filter: none; transform: scale(1); }
  }

  .card .creature-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--border);
    margin: 2px 0 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .creature.appear, .creature.evo-old, .creature.evo-new, .rays.burst,
    .cell.pop, .cell.flash { animation-duration: .01s; }
    .creature.evo-old { opacity: 0; }
    .creature.evo-new { opacity: 1; filter: none; }
  }

  @media (max-height: 700px) {
    .app { gap: 9px; padding-top: 4px; }
    .pad button { padding: 10px 0; }
    .slot, .slot svg { width: 32px; height: 32px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="txt-btn" id="checkBtn">Check</button>
    <h1 id="levelLabel">Level 1</h1>
    <button class="gear" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </div>

  <div class="board" id="board"></div>

  <div class="tools">
    <button class="tool" id="undoBtn">
      <svg viewBox="0 0 24 24"><path d="M4 8h11a5 5 0 0 1 0 10H8"/><path d="M8 4L4 8l4 4"/></svg>
      <span>Undo</span>
    </button>
    <button class="tool" id="eraseBtn">
      <svg viewBox="0 0 24 24"><path d="M4 16l6-6 8 8-4 4H8z"/><path d="M10 10l5-5a2 2 0 0 1 3 0l3 3a2 2 0 0 1 0 3l-3 3"/></svg>
      <span>Erase</span>
    </button>
    <button class="tool" id="notesBtn" data-on="false">
      <span class="badge" id="notesBadge">OFF</span>
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L9 20z"/><path d="M14 7l3 3"/></svg>
      <span>Notes</span>
    </button>
    <button class="tool" id="hintBtn">
      <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5V16H8v-2.5A6 6 0 0 1 12 3z"/></svg>
      <span>Hint</span>
    </button>
  </div>

  <div class="pad" id="pad">
    <button data-n="1">1</button>
    <button data-n="2">2</button>
    <button data-n="3">3</button>
    <button data-n="4">4</button>
  </div>

  <div class="collection">
    <div class="slots" id="slots"></div>
    <div class="next-reward" id="nextReward"></div>
  </div>

</div>

<div class="overlay" id="winOverlay">
  <div class="card">
    <div class="emoji">🎉</div>
    <h2 id="winTitle">Great job!</h2>
    <p id="winText">Level 1 complete</p>
    <button class="btn" id="nextBtn">Next Level</button>
  </div>
</div>

<div class="overlay" id="rewardOverlay">
  <div class="card">
    <div class="stage" id="rewardStage">
      <div class="rays" id="rewardRays"></div>
    </div>
    <div class="creature-name" id="rewardName"></div>
    <p id="rewardText"></p>
    <button class="btn" id="rewardBtn">Nice!</button>
  </div>
</div>

<div class="overlay" id="stampOverlay">
  <div class="card">
    <div class="stage" id="stampStage"></div>
    <div class="creature-name" id="stampName"></div>
    <p id="stampText"></p>
    <button class="btn" id="stampCloseBtn">Close</button>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="card settings">
    <h2>Settings</h2>
    <div class="field">
      <label id="diffLabel">Difficulty</label>
      <div class="segmented" id="difficulty" role="group" aria-labelledby="diffLabel">
        <button data-level="auto" aria-pressed="true">Auto</button>
        <button data-level="easy" aria-pressed="false">Easy</button>
        <button data-level="normal" aria-pressed="false">Medium</button>
        <button data-level="hard" aria-pressed="false">Hard</button>
      </div>
      <p class="hint-text" id="diffNote"></p>
    </div>
    <button class="btn" id="doneBtn">Done</button>
    <button class="btn ghost" id="newPuzzleBtn">New Puzzle</button>
    <button class="btn danger" id="resetBtn">Reset progress to Level 1</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var CELLS = SIZE * SIZE;
  var CLUES = { easy: 8, normal: 6, hard: 5 };
  var LABELS = { easy: 'Easy', normal: 'Medium', hard: 'Hard' };
  var STORE_KEY = 'sudoku4.save.v1';
  var LEVELS_PER_STAMP = 10;

  // On Auto, puzzles get harder as the level count climbs.
  var TIERS = [
    { upTo: 20, difficulty: 'easy' },
    { upTo: 50, difficulty: 'normal' },
    { upTo: Infinity, difficulty: 'hard' }
  ];
  function tierFor(level) {
    for (var i = 0; i < TIERS.length; i++) {
      if (level <= TIERS[i].upTo) return TIERS[i].difficulty;
    }
    return 'hard';
  }

  /* ================= collectible creatures =================
     Original artwork, drawn as inline SVG. Each line has three stages:
     stage 1 is a new stamp, stages 2 and 3 evolve from the one before.
     To use your own pictures instead, swap the `art` string for an
     <img src="..."> — nothing else needs to change. */

  function eyes(x1, x2, y, r) {
    return '<circle cx="' + x1 + '" cy="' + y + '" r="' + r + '" fill="#33302b"/>' +
           '<circle cx="' + x2 + '" cy="' + y + '" r="' + r + '" fill="#33302b"/>' +
           '<circle cx="' + (x1 + r * .35) + '" cy="' + (y - r * .4) + '" r="' + (r * .34) + '" fill="#fff"/>' +
           '<circle cx="' + (x2 + r * .35) + '" cy="' + (y - r * .4) + '" r="' + (r * .34) + '" fill="#fff"/>';
  }
  function shadow() { return '<ellipse cx="60" cy="103" rx="22" ry="5" fill="rgba(51,48,43,.10)"/>'; }
  function smile(y) {
    return '<path d="M55 ' + y + 'q5 5 10 0" stroke="#33302b" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  }

  var CREATURES = [
    {
      line: 'Leaf',
      stages: [
        { name: 'Sprig', art:
          shadow() +
          '<path d="M60 58c-3-12 4-22 14-25 2 12-4 21-14 25z" fill="#43903a"/>' +
          '<path d="M60 60v-9" stroke="#43903a" stroke-width="3" stroke-linecap="round"/>' +
          '<ellipse cx="60" cy="81" rx="22" ry="20" fill="#6bbf59"/>' +
          '<ellipse cx="60" cy="88" rx="14" ry="11" fill="#eaf6cf"/>' +
          eyes(53, 67, 76, 4.2) + smile(86) },
        { name: 'Leaflet', art:
          shadow() +
          '<path d="M45 50c-7-10-3-23 5-28 6 11 3 22-5 28z" fill="#43903a"/>' +
          '<path d="M75 50c7-10 3-23-5-28-6 11-3 22 5 28z" fill="#43903a"/>' +
          '<ellipse cx="31" cy="80" rx="8" ry="5.5" transform="rotate(-25 31 80)" fill="#5aad4a"/>' +
          '<ellipse cx="89" cy="80" rx="8" ry="5.5" transform="rotate(25 89 80)" fill="#5aad4a"/>' +
          '<ellipse cx="60" cy="78" rx="27" ry="25" fill="#6bbf59"/>' +
          '<ellipse cx="60" cy="86" rx="17" ry="14" fill="#eaf6cf"/>' +
          eyes(51, 69, 73, 5) + smile(84) },
        { name: 'Bloomwing', art:
          shadow() +
          '<path d="M32 68q-24-16-27 5 16 11 27 5z" fill="#8fd47c"/>' +
          '<path d="M88 68q24-16 27 5-16 11-27 5z" fill="#8fd47c"/>' +
          '<circle cx="60" cy="30" r="8" fill="#ffd6e6"/><circle cx="48" cy="38" r="8" fill="#ffd6e6"/>' +
          '<circle cx="72" cy="38" r="8" fill="#ffd6e6"/><circle cx="53" cy="50" r="8" fill="#ffd6e6"/>' +
          '<circle cx="67" cy="50" r="8" fill="#ffd6e6"/><circle cx="60" cy="41" r="6" fill="#ffe9a8"/>' +
          '<ellipse cx="60" cy="78" rx="32" ry="28" fill="#6bbf59"/>' +
          '<ellipse cx="60" cy="87" rx="20" ry="16" fill="#eaf6cf"/>' +
          eyes(49, 71, 75, 5.8) + smile(87) }
      ]
    },
    {
      line: 'Flame',
      stages: [
        { name: 'Ember', art:
          shadow() +
          '<path d="M60 56c-9-7-7-18 0-25 7 7 9 18 0 25z" fill="#ffb64d"/>' +
          '<ellipse cx="60" cy="81" rx="22" ry="20" fill="#f2913f"/>' +
          '<ellipse cx="60" cy="88" rx="14" ry="11" fill="#ffe0b5"/>' +
          eyes(53, 67, 76, 4.2) + smile(86) },
        { name: 'Blaze', art:
          shadow() +
          '<path d="M80 84q16 2 14-14-12 2-14 14z" fill="#ffb64d"/>' +
          '<path d="M47 50c-7-7-5-17 1-23 5 7 6 16-1 23z" fill="#ffb64d"/>' +
          '<path d="M60 46c-9-8-7-20 0-27 7 7 9 19 0 27z" fill="#ffd166"/>' +
          '<path d="M73 50c7-7 5-17-1-23-5 7-6 16 1 23z" fill="#ffb64d"/>' +
          '<ellipse cx="60" cy="78" rx="27" ry="25" fill="#f2913f"/>' +
          '<ellipse cx="60" cy="86" rx="17" ry="14" fill="#ffe0b5"/>' +
          eyes(51, 69, 73, 5) + smile(84) },
        { name: 'Pyrewing', art:
          shadow() +
          '<path d="M30 66q-25-13-26 8 16 10 26-8z" fill="#ff9f43"/>' +
          '<path d="M90 66q25-13 26 8-16 10-26-8z" fill="#ff9f43"/>' +
          '<path d="M40 44c-5-9-2-17 3-21 4 8 4 15-3 21z" fill="#ffd166"/>' +
          '<path d="M80 44c5-9 2-17-3-21-4 8-4 15 3 21z" fill="#ffd166"/>' +
          '<path d="M60 40c-11-9-9-23 0-31 9 8 11 22 0 31z" fill="#ffd166"/>' +
          '<circle cx="60" cy="26" r="5" fill="#fff1c4"/>' +
          '<ellipse cx="60" cy="78" rx="32" ry="28" fill="#f2913f"/>' +
          '<ellipse cx="60" cy="87" rx="20" ry="16" fill="#ffe0b5"/>' +
          eyes(49, 71, 75, 5.8) + smile(87) }
      ]
    },
    {
      line: 'Wave',
      stages: [
        { name: 'Droplet', art:
          shadow() +
          '<path d="M60 32c7 9 11 14 11 19a11 11 0 0 1-22 0c0-5 4-10 11-19z" fill="#8fd3f5"/>' +
          '<ellipse cx="60" cy="81" rx="22" ry="20" fill="#56a9de"/>' +
          '<ellipse cx="60" cy="88" rx="14" ry="11" fill="#d5edff"/>' +
          eyes(53, 67, 76, 4.2) + smile(86) },
        { name: 'Splashling', art:
          shadow() +
          '<path d="M60 50q-6-22 4-30 8 12 6 30z" fill="#3a7cb0"/>' +
          '<path d="M80 86q14 6 18-6-12-6-18 6z" fill="#3a7cb0"/>' +
          '<ellipse cx="60" cy="78" rx="27" ry="25" fill="#56a9de"/>' +
          '<ellipse cx="60" cy="86" rx="17" ry="14" fill="#d5edff"/>' +
          eyes(51, 69, 73, 5) + smile(84) },
        { name: 'Tidalfin', art:
          shadow() +
          '<path d="M60 46q-10-30 6-40 10 18 4 40z" fill="#3a7cb0"/>' +
          '<path d="M28 76q-22-6-24 8 14 8 24-8z" fill="#8fd3f5"/>' +
          '<path d="M92 76q22-6 24 8-14 8-24-8z" fill="#8fd3f5"/>' +
          '<path d="M36 48q-8 6-4 14 8-2 4-14z" fill="#3a7cb0"/>' +
          '<path d="M84 48q8 6 4 14-8-2-4-14z" fill="#3a7cb0"/>' +
          '<ellipse cx="60" cy="78" rx="32" ry="28" fill="#56a9de"/>' +
          '<ellipse cx="60" cy="87" rx="20" ry="16" fill="#d5edff"/>' +
          eyes(49, 71, 75, 5.8) + smile(87) }
      ]
    }
  ];

  // Flattened award order: line1 stages 1-3, then line2, then line3.
  var FORMS = [];
  CREATURES.forEach(function (c, li) {
    c.stages.forEach(function (st, si) {
      FORMS.push({ name: st.name, art: st.art, line: c.line, stage: si, lineIndex: li });
    });
  });

  function creatureSvg(form, cls) {
    return '<svg class="creature ' + (cls || '') + '" viewBox="0 0 120 120">' + form.art + '</svg>';
  }

  var state = {
    level: 1,
    difficulty: 'easy',    // the manual pick, used when autoDifficulty is off
    autoDifficulty: true,
    puzzle: [],
    solution: [],
    grid: [],
    notes: [],
    hints: 0,
    solved: false,
    shownAwards: 0,
    selected: null,
    notesMode: false,
    history: []
  };

  var boardEl = document.getElementById('board');
  var padEl = document.getElementById('pad');
  var winOverlay = document.getElementById('winOverlay');
  var settingsOverlay = document.getElementById('settingsOverlay');
  var notesBtn = document.getElementById('notesBtn');
  var notesBadge = document.getElementById('notesBadge');
  var levelLabel = document.getElementById('levelLabel');
  var cellEls = [];

  /* ================= puzzle generation ================= */

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function isSafe(g, idx, val) {
    var r = Math.floor(idx / SIZE), c = idx % SIZE;
    for (var i = 0; i < SIZE; i++) {
      if (g[r * SIZE + i] === val) return false;
      if (g[i * SIZE + c] === val) return false;
    }
    var br = r - r % 2, bc = c - c % 2;
    for (var dr = 0; dr < 2; dr++) {
      for (var dc = 0; dc < 2; dc++) {
        if (g[(br + dr) * SIZE + bc + dc] === val) return false;
      }
    }
    return true;
  }

  function fill(g, pos) {
    if (pos === CELLS) return true;
    if (g[pos] !== 0) return fill(g, pos + 1);
    var nums = shuffled([1, 2, 3, 4]);
    for (var i = 0; i < nums.length; i++) {
      if (isSafe(g, pos, nums[i])) {
        g[pos] = nums[i];
        if (fill(g, pos + 1)) return true;
        g[pos] = 0;
      }
    }
    return false;
  }

  function countSolutions(g, pos, found) {
    if (pos === CELLS) return found + 1;
    if (g[pos] !== 0) return countSolutions(g, pos + 1, found);
    for (var n = 1; n <= SIZE; n++) {
      if (isSafe(g, pos, n)) {
        g[pos] = n;
        found = countSolutions(g, pos + 1, found);
        g[pos] = 0;
        if (found > 1) return found;
      }
    }
    return found;
  }

  function generate(difficulty) {
    var solution = new Array(CELLS).fill(0);
    fill(solution, 0);

    var puzzle = solution.slice();
    var target = CLUES[difficulty] || CLUES.easy;
    var order = shuffled(Array.from({ length: CELLS }, function (_, i) { return i; }));
    var clues = CELLS;

    for (var k = 0; k < order.length && clues > target; k++) {
      var idx = order[k];
      var backup = puzzle[idx];
      puzzle[idx] = 0;
      if (countSolutions(puzzle.slice(), 0, 0) === 1) clues--;
      else puzzle[idx] = backup;
    }
    return { puzzle: puzzle, solution: solution };
  }

  /* ================= saved progress ================= */

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        level: state.level,
        difficulty: state.difficulty,
        autoDifficulty: state.autoDifficulty,
        puzzle: state.puzzle,
        solution: state.solution,
        grid: state.grid,
        notes: state.notes,
        hints: state.hints,
        solved: state.solved,
        shownAwards: state.shownAwards
      }));
    } catch (e) { /* private mode / storage full: just play without saving */ }
  }

  function looksValid(s) {
    return s && typeof s.level === 'number' && s.level >= 1 &&
      Array.isArray(s.puzzle) && s.puzzle.length === CELLS &&
      Array.isArray(s.solution) && s.solution.length === CELLS &&
      Array.isArray(s.grid) && s.grid.length === CELLS &&
      Array.isArray(s.notes) && s.notes.length === CELLS;
  }

  function load() {
    var raw;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return false; }
    if (!raw) return false;

    var s;
    try { s = JSON.parse(raw); } catch (e) { return false; }
    if (!looksValid(s)) return false;

    state.level = s.level;
    state.difficulty = CLUES[s.difficulty] ? s.difficulty : 'easy';
    // Saves written before Auto existed had no way to express it, so they
    // opt in; only an explicit manual pick turns it off.
    state.autoDifficulty = s.autoDifficulty !== false;
    state.hints = s.hints || 0;
    // Clamp, so a hand-edited or stale save can't skip or replay awards.
    state.shownAwards = Math.max(0, Math.min(earnedAwards(), s.shownAwards || 0));

    // Closed the app on the win screen: hand them the next level.
    if (s.solved) {
      newPuzzle();
      return true;
    }

    state.puzzle = s.puzzle;
    state.solution = s.solution;
    state.grid = s.grid;
    state.notes = s.notes.map(function (n) { return Array.isArray(n) ? n : []; });
    state.solved = false;
    state.history = [];
    state.selected = null;
    return true;
  }

  /* ================= game flow ================= */

  function buildBoard() {
    boardEl.innerHTML = '';
    cellEls = [];
    for (var i = 0; i < CELLS; i++) {
      var d = document.createElement('div');
      d.className = 'cell';
      d.dataset.i = i;
      d.dataset.r = Math.floor(i / SIZE);
      d.dataset.c = i % SIZE;
      boardEl.appendChild(d);
      cellEls.push(d);
    }
  }

  function effectiveDifficulty() {
    return state.autoDifficulty ? tierFor(state.level) : state.difficulty;
  }

  // New puzzle at the current level, keeping progress.
  function newPuzzle() {
    var made = generate(effectiveDifficulty());
    state.puzzle = made.puzzle;
    state.solution = made.solution;
    state.grid = made.puzzle.slice();
    state.notes = Array.from({ length: CELLS }, function () { return []; });
    state.history = [];
    state.hints = 0;
    state.solved = false;
    state.selected = null;
    setNotesMode(false);
    save();
  }

  function isGiven(i) { return state.puzzle[i] !== 0; }

  function peersOf(i) {
    var r = Math.floor(i / SIZE), c = i % SIZE;
    var br = r - r % 2, bc = c - c % 2;
    var set = {};
    for (var k = 0; k < SIZE; k++) {
      set[r * SIZE + k] = true;
      set[k * SIZE + c] = true;
    }
    for (var dr = 0; dr < 2; dr++) {
      for (var dc = 0; dc < 2; dc++) set[(br + dr) * SIZE + bc + dc] = true;
    }
    return set;
  }

  function render() {
    levelLabel.textContent = 'Level ' + state.level;

    var sel = state.selected;
    var peers = sel === null ? {} : peersOf(sel);
    var selVal = sel === null ? 0 : state.grid[sel];

    for (var i = 0; i < CELLS; i++) {
      var el = cellEls[i];
      var val = state.grid[i];
      var cls = 'cell';

      if (isGiven(i)) cls += ' given';
      else if (val) cls += ' filled';
      if (sel !== null) {
        if (peers[i]) cls += ' peer';
        if (selVal && val === selVal && i !== sel) cls += ' same';
        if (i === sel) cls += ' selected';
      }
      if (val && !isGiven(i) && val !== state.solution[i]) cls += ' wrong';
      el.className = cls;

      if (val) {
        el.textContent = val;
      } else if (state.notes[i].length) {
        el.textContent = '';
        var wrap = document.createElement('div');
        wrap.className = 'notes';
        for (var n = 1; n <= SIZE; n++) {
          var s = document.createElement('span');
          s.textContent = state.notes[i].indexOf(n) >= 0 ? n : '';
          wrap.appendChild(s);
        }
        el.appendChild(wrap);
      } else {
        el.textContent = '';
      }
    }

    var counts = [0, 0, 0, 0, 0];
    for (var j = 0; j < CELLS; j++) {
      if (state.grid[j] && state.grid[j] === state.solution[j]) counts[state.grid[j]]++;
    }
    Array.prototype.forEach.call(padEl.children, function (btn) {
      btn.classList.toggle('done', counts[+btn.dataset.n] === SIZE);
    });

    document.getElementById('undoBtn').disabled = state.history.length === 0;
    renderCollection();
  }

  function pushHistory(i) {
    state.history.push({
      i: i,
      grid: state.grid.slice(),
      notes: state.notes.map(function (n) { return n.slice(); })
    });
    if (state.history.length > 100) state.history.shift();
  }

  function place(n) {
    var i = state.selected;
    if (i === null || isGiven(i) || state.solved) return;

    pushHistory(i);

    if (state.notesMode) {
      if (state.grid[i]) state.grid[i] = 0;
      var pos = state.notes[i].indexOf(n);
      if (pos >= 0) state.notes[i].splice(pos, 1);
      else state.notes[i].push(n);
    } else {
      state.grid[i] = state.grid[i] === n ? 0 : n;
      state.notes[i] = [];
      if (state.grid[i]) {
        var peers = peersOf(i);
        Object.keys(peers).forEach(function (p) {
          var k = state.notes[p].indexOf(n);
          if (k >= 0) state.notes[p].splice(k, 1);
        });
      }
    }

    render();
    save();

    var el = cellEls[i];
    if (!state.notesMode && state.grid[i]) {
      var ok = state.grid[i] === state.solution[i];
      el.classList.add(ok ? 'pop' : 'flash');
      setTimeout(function () { el.classList.remove(ok ? 'pop' : 'flash'); }, 360);
    }

    checkWin();
  }

  function erase() {
    var i = state.selected;
    if (i === null || isGiven(i) || state.solved) return;
    if (!state.grid[i] && !state.notes[i].length) return;
    pushHistory(i);
    state.grid[i] = 0;
    state.notes[i] = [];
    render();
    save();
  }

  function undo() {
    var last = state.history.pop();
    if (!last) return;
    state.grid = last.grid;
    state.notes = last.notes;
    state.selected = last.i;
    render();
    save();
  }

  function hint() {
    if (state.solved) return;
    var candidates = [];
    for (var i = 0; i < CELLS; i++) {
      if (!isGiven(i) && state.grid[i] !== state.solution[i]) candidates.push(i);
    }
    if (!candidates.length) return;

    var target = (state.selected !== null && candidates.indexOf(state.selected) >= 0)
      ? state.selected
      : candidates[Math.floor(Math.random() * candidates.length)];

    pushHistory(target);
    state.grid[target] = state.solution[target];
    state.notes[target] = [];
    state.selected = target;
    state.hints++;
    render();
    save();

    cellEls[target].classList.add('pop');
    setTimeout(function () { cellEls[target].classList.remove('pop'); }, 260);
    checkWin();
  }

  function checkAll() {
    var wrong = [], right = [];
    for (var i = 0; i < CELLS; i++) {
      if (isGiven(i) || !state.grid[i]) continue;
      (state.grid[i] === state.solution[i] ? right : wrong).push(cellEls[i]);
    }
    var targets = wrong.length ? wrong : right;
    var cls = wrong.length ? 'flash' : 'pop';
    targets.forEach(function (el) {
      el.classList.add(cls);
      setTimeout(function () { el.classList.remove(cls); }, 380);
    });
  }

  function checkWin() {
    for (var i = 0; i < CELLS; i++) {
      if (state.grid[i] !== state.solution[i]) return;
    }
    var msg = 'Level ' + state.level + ' complete' +
      (state.hints === 0 ? ' with no hints!' : ' (' + state.hints +
        (state.hints === 1 ? ' hint' : ' hints') + ' used)');

    // Bank the level now, so closing the app here still counts as a win.
    state.level++;

    // Call out the step up so the jump in difficulty isn't a nasty surprise.
    if (state.autoDifficulty && tierFor(state.level) !== tierFor(state.level - 1)) {
      msg += ' Puzzles now step up to ' + LABELS[tierFor(state.level)] + '!';
    }
    document.getElementById('winText').textContent = msg;

    state.solved = true;
    state.selected = null;
    save();
    render();

    setTimeout(function () { winOverlay.classList.add('show'); }, 350);
  }

  function setNotesMode(on) {
    state.notesMode = on;
    notesBtn.dataset.on = on ? 'true' : 'false';
    notesBadge.textContent = on ? 'ON' : 'OFF';
  }

  /* ================= stamps & evolution ================= */

  // One stamp per 10 completed levels. state.level is 1-based and only
  // increments on a win, so completed levels are state.level - 1.
  function earnedAwards() {
    return Math.max(0, Math.min(FORMS.length, Math.floor((state.level - 1) / LEVELS_PER_STAMP)));
  }

  function renderCollection() {
    // Only stamps whose reveal has played, so the strip never spoils an
    // evolution that is still animating.
    var earned = Math.min(earnedAwards(), state.shownAwards);
    var slots = document.getElementById('slots');
    var lastEarned = null;
    slots.innerHTML = '';

    FORMS.forEach(function (form, i) {
      if (i > 0 && form.stage === 0) {
        var sep = document.createElement('div');
        sep.className = 'slot divider';
        slots.appendChild(sep);
      }
      var el = document.createElement('button');
      if (i < earned) {
        el.className = 'slot earned';
        el.innerHTML = creatureSvg(form);
        el.title = form.name;
        el.setAttribute('aria-label', form.name);
        el.addEventListener('click', function () { openStamp(i); });
        lastEarned = el;
      } else {
        el.className = 'slot empty';
        el.disabled = true;
        el.setAttribute('aria-label', 'Not collected yet');
      }
      slots.appendChild(el);
    });

    // Keep the most recent stamp in view once the row overflows.
    if (lastEarned) slots.scrollLeft = Math.max(0, lastEarned.offsetLeft + lastEarned.offsetWidth - slots.clientWidth);

    var note = document.getElementById('nextReward');
    if (earned >= FORMS.length) {
      note.textContent = 'All ' + FORMS.length + ' collected!';
    } else {
      var togo = LEVELS_PER_STAMP - ((state.level - 1) % LEVELS_PER_STAMP);
      var next = FORMS[earned];
      note.textContent = togo + (togo === 1 ? ' level to ' : ' levels to ') +
        (next.stage === 0 ? 'a new friend' : 'evolve');
    }
  }

  function openStamp(i) {
    var form = FORMS[i];
    document.getElementById('stampStage').innerHTML = creatureSvg(form);
    document.getElementById('stampName').textContent = form.name;
    document.getElementById('stampText').textContent =
      form.line + ' family - stage ' + (form.stage + 1) + ' of 3';
    document.getElementById('stampOverlay').classList.add('show');
  }

  // Shows one pending award; called again if several are somehow owed.
  function showNextAward() {
    if (state.shownAwards >= earnedAwards()) return false;

    var idx = state.shownAwards;
    var form = FORMS[idx];
    var stage = document.getElementById('rewardStage');
    var rays = document.getElementById('rewardRays');
    var nameEl = document.getElementById('rewardName');
    var textEl = document.getElementById('rewardText');

    // Rebuild the stage: rays layer + the creature(s) for this award.
    stage.innerHTML = '';
    rays.className = 'rays';
    stage.appendChild(rays);

    if (form.stage === 0) {
      stage.insertAdjacentHTML('beforeend', creatureSvg(form, 'appear'));
      nameEl.textContent = form.name;
      textEl.textContent = 'A new friend joined your collection!';
      void rays.offsetWidth;
      rays.className = 'rays burst';
    } else {
      var prev = FORMS[idx - 1];
      stage.insertAdjacentHTML('beforeend', creatureSvg(prev, 'evo-old'));
      stage.insertAdjacentHTML('beforeend', creatureSvg(form, 'evo-new'));
      nameEl.textContent = prev.name;
      textEl.textContent = 'What? ' + prev.name + ' is evolving!';
      // Reveal happens ~78% into the 3s evolution animation.
      setTimeout(function () {
        nameEl.textContent = form.name;
        textEl.textContent = prev.name + ' evolved into ' + form.name + '!';
        void rays.offsetWidth;
        rays.className = 'rays burst';
      }, 2300);
    }

    state.shownAwards = idx + 1;
    save();
    document.getElementById('rewardOverlay').classList.add('show');
    return true;
  }

  function syncDifficultyButtons() {
    var group = document.getElementById('difficulty');
    var current = state.autoDifficulty ? 'auto' : state.difficulty;
    Array.prototype.forEach.call(group.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.level === current ? 'true' : 'false');
    });

    var note = document.getElementById('diffNote');
    if (state.autoDifficulty) {
      var next = TIERS.filter(function (t) { return t.upTo !== Infinity && state.level <= t.upTo; })[0];
      note.textContent = 'Gets harder as the levels go up. Right now: ' +
        LABELS[effectiveDifficulty()] +
        (next ? ' (until level ' + next.upTo + ').' : '.');
    } else {
      note.textContent = 'Changing this starts a fresh puzzle.';
    }
  }

  /* ================= events ================= */

  boardEl.addEventListener('click', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell || state.solved) return;
    state.selected = +cell.dataset.i;
    render();
  });

  padEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) place(+btn.dataset.n);
  });

  document.getElementById('checkBtn').addEventListener('click', checkAll);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('eraseBtn').addEventListener('click', erase);
  document.getElementById('hintBtn').addEventListener('click', hint);
  notesBtn.addEventListener('click', function () { setNotesMode(!state.notesMode); });

  var rewardOverlay = document.getElementById('rewardOverlay');

  document.getElementById('nextBtn').addEventListener('click', function () {
    winOverlay.classList.remove('show');
    // A stamp or evolution is the payoff for the level just finished,
    // so it plays before the next puzzle is dealt.
    if (showNextAward()) return;
    newPuzzle();
    render();
  });

  document.getElementById('rewardBtn').addEventListener('click', function () {
    rewardOverlay.classList.remove('show');
    if (showNextAward()) return;
    // state.solved is still true when the award followed a win; when the
    // award was owed from a previous session, load() already dealt a board.
    if (state.solved) newPuzzle();
    render();
  });

  document.getElementById('stampCloseBtn').addEventListener('click', function () {
    document.getElementById('stampOverlay').classList.remove('show');
  });
  document.getElementById('stampOverlay').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  // settings
  function closeSettings() {
    settingsOverlay.classList.remove('show');
    disarmReset();
  }

  document.getElementById('settingsBtn').addEventListener('click', function () {
    syncDifficultyButtons();
    disarmReset();
    settingsOverlay.classList.add('show');
  });
  document.getElementById('doneBtn').addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', function (e) {
    if (e.target === settingsOverlay) closeSettings();
  });

  document.getElementById('difficulty').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var pick = btn.dataset.level;
    if (pick === (state.autoDifficulty ? 'auto' : state.difficulty)) return;

    var was = effectiveDifficulty();
    if (pick === 'auto') {
      state.autoDifficulty = true;
    } else {
      state.autoDifficulty = false;
      state.difficulty = pick;
    }
    syncDifficultyButtons();
    // Only re-deal when the puzzle would actually change.
    if (effectiveDifficulty() !== was) newPuzzle();
    save();
    render();
  });

  document.getElementById('newPuzzleBtn').addEventListener('click', function () {
    closeSettings();
    newPuzzle();
    render();
  });

  // Two taps to reset, so a stray tap can't wipe a kid's progress.
  var resetBtn = document.getElementById('resetBtn');
  var resetArmed = false, resetTimer = null;

  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    resetBtn.textContent = 'Reset progress to Level 1';
  }

  resetBtn.addEventListener('click', function () {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = 'Tap again to confirm reset';
      resetTimer = setTimeout(disarmReset, 4000);
      return;
    }
    disarmReset();
    state.level = 1;
    state.shownAwards = 0;   // stamps are earned from the level count, so they clear too
    settingsOverlay.classList.remove('show');
    newPuzzle();
    render();
  });

  // keyboard, for playing on a computer
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeSettings();
      document.getElementById('stampOverlay').classList.remove('show');
      return;
    }
    if (e.key >= '1' && e.key <= '4') { place(+e.key); return; }
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { erase(); return; }
    var arrows = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
    if (arrows[e.key]) {
      e.preventDefault();
      if (state.selected === null) { state.selected = 0; }
      else {
        var r = Math.floor(state.selected / SIZE), c = state.selected % SIZE;
        if (e.key === 'ArrowUp') r = Math.max(0, r - 1);
        if (e.key === 'ArrowDown') r = Math.min(SIZE - 1, r + 1);
        if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
        if (e.key === 'ArrowRight') c = Math.min(SIZE - 1, c + 1);
        state.selected = r * SIZE + c;
      }
      render();
    }
  });

  buildBoard();
  if (!load()) newPuzzle();
  setNotesMode(false);
  render();
  // Owed a stamp from a session that ended right after a win.
  setTimeout(showNextAward, 500);

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
